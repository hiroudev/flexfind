[package]
name = "flex-find"
version = "0.1.0"
description = "FlexFind — 高速ファイル名検索ランチャー"
authors = ["FlexFind"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "flex_find_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps the webview inspector available in release builds. This
# app is diagnosed on machines that can't run a dev server, and a UI problem
# that only reproduces there is otherwise invisible — there is no console to
# read and no way to tell "handler never fired" from "handler fired and
# rendered nothing".
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
walkdir = "2"
bincode = "1"
# SIMD substring search. `str::find` recompiles its needle analysis on every
# call; `memmem::Finder` is built once per search and then run against ~1.3M
# names, which is exactly the shape of the scan.
memchr = "2"
tauri-plugin-window-state = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# The search hot loop streams tens of MB of packed name data per keystroke,
# so this binary is optimized for speed, not size. `opt-level = "s"` (the
# previous setting) holds back vectorization in exactly the substring-scan
# inner loop that dominates a search.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# `tauri dev` builds with this profile. At the default `opt-level = 0` the
# scan runs an order of magnitude slower than the shipped binary, which makes
# dev-time performance observations meaningless (and misled an earlier
# investigation). Level 2 keeps builds reasonably quick while staying
# representative.
[profile.dev]
opt-level = 2
